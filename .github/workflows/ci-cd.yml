name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  # Docker image names
  USER_SERVICE_IMAGE: banking-user-service
  ACCOUNT_SERVICE_IMAGE: banking-account-service
  TRANSACTION_SERVICE_IMAGE: banking-transaction-service
  NOTIFICATION_SERVICE_IMAGE: banking-notification-service
  API_GATEWAY_IMAGE: banking-api-gateway
  
  # Docker registry (can be Docker Hub, ECR, GCR, etc.)
  REGISTRY: docker.io
  REGISTRY_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim
        env:
          ORACLE_PASSWORD: password
          APP_USER: bankuser
          APP_USER_PASSWORD: bankpass
          APP_DATASET: bankdb
        ports: [1521:1521]
        options: >-
          --health-cmd="sqlplus -s sys/password@//localhost:1521/XEPDB1 \"SELECT 1 FROM DUAL\""
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies for all services
      run: |
        pip install pytest
        for service in account-service transaction-service user-service notification-service api-gateway; do
          cd $service
          pip install -r requirements.txt
          cd ..
        done
    
    - name: Run tests
      run: |
        # In a real system, you would run actual tests here
        echo "Running tests..."
        # Placeholder for actual test execution
        # Example: pytest tests/ -v
    
  build-and-push:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ env.REGISTRY_USERNAME }}
        password: ${{ env.REGISTRY_PASSWORD }}
    
    - name: Build and push user-service
      uses: docker/build-push-action@v3
      with:
        context: ./user-service
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.USER_SERVICE_IMAGE }}:${{ github.sha }}
    
    - name: Build and push account-service
      uses: docker/build-push-action@v3
      with:
        context: ./account-service
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.ACCOUNT_SERVICE_IMAGE }}:${{ github.sha }}
    
    - name: Build and push transaction-service
      uses: docker/build-push-action@v3
      with:
        context: ./transaction-service
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.TRANSACTION_SERVICE_IMAGE }}:${{ github.sha }}
    
    - name: Build and push notification-service
      uses: docker/build-push-action@v3
      with:
        context: ./notification-service
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.NOTIFICATION_SERVICE_IMAGE }}:${{ github.sha }}
    
    - name: Build and push api-gateway
      uses: docker/build-push-action@v3
      with:
        context: ./api-gateway
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.API_GATEWAY_IMAGE }}:${{ github.sha }}
    
    - name: Image digest
      run: |
        echo "User service image digest: ${{ steps.build-and-push-user-service.outputs.digest }}"
        echo "Account service image digest: ${{ steps.build-and-push-account-service.outputs.digest }}"
        echo "Transaction service image digest: ${{ steps.build-and-push-transaction-service.outputs.digest }}"
        echo "Notification service image digest: ${{ steps.build-and-push-notification-service.outputs.digest }}"
        echo "API gateway image digest: ${{ steps.build-and-push-api-gateway.outputs.digest }}"

  deploy:
    name: Deploy to Serverless
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Deploy to AWS Lambda (example)
      run: |
        echo "Deploying to AWS Lambda..."
        # In a real implementation, you would:
        # 1. Pull the Docker images from registry
        # 2. Create/update Lambda functions using container images
        # 3. Update API Gateway routes
        # 4. Deploy any infrastructure changes (using Terraform, CloudFormation, etc.)
        
        # Example commands (would need actual implementation):
        # aws lambda update-function-code --function-name banking-user-service --image-uri ${{ env.REGISTRY }}/${{ env.USER_SERVICE_IMAGE }}:${{ github.sha }}
        # aws lambda update-function-code --function-name banking-account-service --image-uri ${{ env.REGISTRY }}/${{ env.ACCOUNT_SERVICE_IMAGE }}:${{ github.sha }}
        # etc.
        
        echo "Deployment completed!"